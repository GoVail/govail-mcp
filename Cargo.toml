[workspace]
resolver = "2"
members = [
    "crates/govail-mcp-contracts",
    "crates/govail-mcp-core",
    "crates/govail-mcp-sdk",
    "examples/promptia-context",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "3.1.2", default-features = false, features = ["server", "client", "transport-async-rw", "transport-io"] }
