services:
  govail-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govail-mcp
    ports:
      - "8096:8096"
    environment:
      - GOVAIL_GATEWAY_URL=${GOVAIL_GATEWAY_URL:-http://<gateway_api_url>}
      - GOVAIL_RUNTIME_URL=${GOVAIL_RUNTIME_URL:-http://<runtime_api_url>}
      - GOVAIL_MEMORY_URL=${GOVAIL_MEMORY_URL:-http://<memory_api_url>}
      - SENTINEL_API_URL=${SENTINEL_API_URL:-http://<sentinel_api_url>}
      - LLM_API_URL=${LLM_API_URL:-http://<llm_api_url>/v1}
      - LLM_API_KEY=${LLM_API_KEY:-none}
      - LLM_MODEL=${LLM_MODEL:-auto}
      - GRC_DATABASE_URL=${GRC_DATABASE_URL:-}
      - GRC_EVIDENCE_STORE_DIR=${GRC_EVIDENCE_STORE_DIR:-/data/evidence}
      - GOVAIL_HTTP_TIMEOUT=${GOVAIL_HTTP_TIMEOUT:-90.0}
      - MCP_PORT=8096
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ${GRC_EVIDENCE_HOST_DIR:-./data/evidence}:/data/evidence
    restart: always
